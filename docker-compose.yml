name: pulse-backend

services:
  backend:
    image: pulse-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: ":8080"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      AUTH_RATE_LIMIT_REQUESTS: "${AUTH_RATE_LIMIT_REQUESTS:-30}"
      AUTH_RATE_LIMIT_WINDOW: "${AUTH_RATE_LIMIT_WINDOW:-1m}"
      AUTH_RATE_LIMIT_MAX_KEYS: "${AUTH_RATE_LIMIT_MAX_KEYS:-100000}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-pulse}
      DB_PASSWORD: ${DB_PASSWORD:-pulse}
      DB_NAME: ${DB_NAME:-pulse}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-secret-of-at-least-32-bytes}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-pulse}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pulse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pulse-minio-secret}
    depends_on:
      db-schema:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulse}
      POSTGRES_USER: ${DB_USER:-pulse}
      POSTGRES_DB: ${DB_NAME:-pulse}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # PostgreSQL 18 stores versioned clusters below /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      - ./migrations/initial_001.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./migrations/decisions_002.sql:/docker-entrypoint-initdb.d/002_decisions.sql:ro
    ports:
      - "${DB_PUBLISHED_PORT:-5432}:5432"
    restart: unless-stopped

  db-schema:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${DB_USER:-pulse}
      PGPASSWORD: ${DB_PASSWORD:-pulse}
      PGDATABASE: ${DB_NAME:-pulse}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        test "$$(psql -X -Atqc "
          SELECT count(*) = 2
          FROM schema_migrations
          WHERE version IN ('initial_001', 'decisions_002')
        ")" = "t"
        test "$$(psql -X -Atqc "
          SELECT count(*) = 7
          FROM information_schema.tables
          WHERE table_schema = 'public'
            AND table_name IN ('users', 'profiles', 'preferences', 'photos', 'swipes', 'matches', 'refresh_sessions')
        ")" = "t"
        test "$$(psql -X -Atqc "
          SELECT data_type = 'uuid'
          FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'users' AND column_name = 'id'
        ")" = "t"
    restart: "no"

  minio:
    # Upstream stopped publishing community Docker images after this release;
    # this image is a pinned rebuild of the upstream MinIO source revision.
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pulse}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pulse-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-pulse}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - minio_data:/data
    ports:
      - "${S3_PUBLISHED_PORT:-9000}:9000"
      - "${S3_CONSOLE_PUBLISHED_PORT:-9001}:9001"
    restart: unless-stopped

  minio-init:
    image: 11notes/mc:2025.08.13@sha256:4cf6d9bb2db787a26c2780359197ea1dd30cb02a57e4ef0795de7e33a7db27b5
    environment:
      MC_MINIO_URL: http://minio:9000
      MC_MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pulse}
      MC_MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-pulse-minio-secret}
    command:
      - ready minio
      - mb --ignore-existing minio/${S3_BUCKET:-pulse}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - minio_client_config:/mc/etc
    restart: "no"

volumes:
  postgres_data:
  minio_data:
  minio_client_config:
