services:
  backend:
    image: backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-pulse}
      DB_PASSWORD: ${DB_PASSWORD:-pulse}
      DB_NAME: ${DB_NAME:-pulse}
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulse}
      POSTGRES_USER: ${DB_USER:-pulse}
      POSTGRES_DB: ${DB_NAME:-pulse}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/postgresql/data_new
    ports:
      - "5432:5432"
    restart: unless-stopped


volumes:
  db_data:
