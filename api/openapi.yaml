openapi: 3.1.0
info:
  title: Pulse API
  version: 0.2.0
  x-current-release: mvp
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    HTTP API for the Pulse dating application.

    Dating conversations are separate resources created from mutual matches.
    Closing a match disables new messages but does not delete message history.
    Administrative notifications are not part of dating conversations.
    MVP includes authentication and session lifecycle, profiles, photos,
    preferences, discovery, swipes, and match lists. Chat, match closure, and
    moderation are later releases. A pair can match only once, even after closure.
    Release annotations describe scope, not implementation completeness.
    JSON request bodies require Content-Type application/json (optional UTF-8
    charset) and at most 16 KiB. Unsupported or missing Content-Type, unknown
    fields and multiple JSON values return 400. Photo upload uses multipart.
    Feed and match queries accept only cursor and limit; malformed, unknown
    or repeated parameters return 400. Errors carry the response X-Request-ID.
servers:
  - url: /
    description: Current Pulse API host

tags:
  - name: Health
    description: Liveness and dependency readiness checks.
  - name: Auth
    description: User and administrator authentication and session lifecycle.
  - name: Profile
    description: Current-user profile, preferences, and sleep mode.
  - name: Photos
    description: Current-user profile photo management.
  - name: Discovery
    description: Personalized dating candidate feed.
  - name: Matching
    description: Swipes and mutual matches.
  - name: Conversations
    description: Dating and support conversations and their messages.
  - name: Reports
    description: User-created moderation reports.
  - name: Admin
    description: Administrator-only moderation operations.

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      x-release: infrastructure
      x-implementation-status: implemented
      summary: Check whether the API process is running
      security: []
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: API process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      x-release: infrastructure
      x-implementation-status: implemented
      summary: Check whether the API is ready to serve traffic
      security: []
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: API and its required dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      x-release: mvp
      x-implementation-status: partial
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      x-release: mvp
      x-implementation-status: partial
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/admin/auth/login:
    post:
      tags: [Auth, Admin]
      operationId: loginAdmin
      x-release: moderation
      x-implementation-status: partial
      summary: Authenticate an administrator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "501":
          $ref: "#/components/responses/NotImplemented"
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      x-release: mvp
      x-implementation-status: partial
      summary: Rotate a refresh token and issue a new session
      description: |
        The supplied refresh token becomes invalid after a successful rotation.
        Of concurrent requests with the same refresh token only one succeeds.
        A blocked account receives 401 here; login reports the block as 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-release: mvp
      x-implementation-status: partial
      summary: Revoke a refresh session
      description: |
        Revokes the caller's refresh session. The refresh token must belong to the
        user of the access token, otherwise 401. Repeating logout returns 204.
        Already issued access tokens stay valid until they expire.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Session revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/profile:
    get:
      tags: [Profile]
      operationId: getOwnProfile
      x-release: mvp
      x-implementation-status: partial
      summary: Get the current user's profile
      description: Photos are ordered by position and receive fresh URLs on each read.
      x-required-principal: user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile, preferences, and photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The user has not created a profile yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Profile]
      operationId: putOwnProfile
      x-release: mvp
      x-implementation-status: partial
      summary: Create or replace the current user's profile
      description: |
        Sets users.age and the profile in one transaction. Text fields are trimmed;
        lengths are counted in Unicode characters. Omitted bio becomes empty.
        Sleep mode is not changed by this operation.
      x-required-principal: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutProfileRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/preferences:
    put:
      tags: [Profile]
      operationId: putOwnPreferences
      x-release: mvp
      x-implementation-status: partial
      summary: Create or replace discovery preferences
      x-required-principal: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutPreferencesRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Preferences saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "409":
          description: The user has not created a profile yet (error code profile_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/profile/sleep:
    patch:
      tags: [Profile]
      operationId: setProfileSleepMode
      x-release: mvp
      x-implementation-status: partial
      summary: Enable or disable sleep mode
      description: |
        A sleeping profile is not shown to others and cannot use the feed or swipe.
        Waking up restores discovery only for a complete profile with a photo.
      x-required-principal: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSleepRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Sleep mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SleepState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The user has not created a profile yet (error code profile_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/photos:
    post:
      tags: [Photos]
      operationId: uploadPhoto
      x-release: mvp
      x-implementation-status: partial
      summary: Upload a profile photo
      description: |
        HTTP/application and PostgreSQL adapter wiring are implemented; the four
        photo SQL queries are placeholders pending the database implementation.
        Requires an existing profile. Accepts exactly one file and one position;
        unknown/duplicate multipart fields are rejected. Ownership comes from JWT.
        The complete image is decoded, independently of filename or declared MIME.
        File limit: 10485760 bytes; total multipart body limit: 10551296 bytes.
        Images over 25000000 decoded pixels are rejected to bound memory use.
        An occupied position returns 409; a missing profile returns 409 with
        profile_required. Failed metadata writes trigger object compensation.
      x-required-principal: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadPhotoRequest"
      responses:
        "201":
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Photo position occupied (conflict) or profile missing (profile_required).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/photos/{photo_id}:
    parameters:
      - $ref: "#/components/parameters/PhotoID"
    delete:
      tags: [Photos]
      operationId: deletePhoto
      x-release: mvp
      x-implementation-status: partial
      summary: Delete one of the current user's photos
      description: |
        HTTP/application and PostgreSQL adapter wiring are implemented; SQL is pending.
        A missing or foreign photo returns the same 404. Deletes the object before
        metadata; a failed object deletion retains metadata. If metadata deletion
        fails after object deletion, retrying safely finishes cleanup.
        Repeating a successful deletion returns 404. Deleting the last photo
        preserves the profile, which is no longer eligible for discovery.
      x-required-principal: user
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Photo deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/feed:
    get:
      tags: [Discovery]
      operationId: getDiscoveryFeed
      x-release: mvp
      x-implementation-status: partial
      summary: Get profile recommendations
      description: |
        Requires a completed profile, preferences, at least one photo, and sleep
        mode disabled. Applies both users' age and sex preferences. Excludes
        self, sleeping or blocked users, previously swiped users, and every
        existing match pair including closed pairs. Returns an empty items
        array when exhausted; MVP does not reset swipe history.
        Pagination order is users.created_at descending, then users.id descending.
        Cursors belong to this list and the authenticated user.
        HTTP/application, snapshot reads and bulk photo adapter wiring are implemented;
        search-state, candidate and bulk-photo SQL queries are placeholders.
        Only cursor and limit query parameters are accepted; empty, duplicate or
        malformed parameters return 400. Unfinished onboarding, no photos or sleep
        return 403. Candidate filtering and SQL performance await database verification.
      x-required-principal: user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/swipes:
    post:
      tags: [Matching]
      operationId: createSwipe
      x-release: mvp
      x-implementation-status: partial
      summary: Like or dislike a user
      description: |
        Saving the swipe and creating a mutual match are atomic, including checks
        of both profiles and mutual preferences. An existing outgoing swipe or
        active/closed match pair returns 409 without rewriting swipe history.
        An unavailable candidate returns 404; a self-swipe or a to_user_id that
        is not a UUID returns 422. A missing or non-boolean is_like returns 400.
        403 means the caller cannot take part in discovery: blocked, incomplete
        profile or preferences, no photos, or sleep mode.
        HTTP/application and PostgreSQL adapter are wired. SQL remains placeholders;
        database atomicity and concurrency await verification with filled queries.
      x-required-principal: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeRequest"
      responses:
        "200":
          description: Swipe saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/matches:
    get:
      tags: [Matching]
      operationId: listMatches
      x-release: mvp
      x-implementation-status: partial
      summary: List the current user's matches
      description: |
        Returns only the caller's matches, including closed pairs. Sleeping or
        incomplete profiles may still read their existing matches.
        Pagination order is matches.created_at descending, then matches.id descending.
        Cursors belong to this list and the authenticated user.
        user.photo_url is the partner's photo with the lowest position, omitted
        when the partner has no photos; it is a temporary link.
        An empty, repeated or foreign cursor and an explicit limit outside
        1-100 (including 0) or not a plain integer return 400. 403 is returned
        only for a blocked caller.
        HTTP/application and PostgreSQL adapter are wired; list SQL is a placeholder.
      x-required-principal: user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/matches/{match_id}:
    parameters:
      - $ref: "#/components/parameters/MatchID"
    delete:
      tags: [Matching]
      operationId: closeMatch
      x-release: chat
      x-implementation-status: placeholder
      summary: Permanently close a match
      description: |
        Preserves the match, conversation, and message history. Both users may
        read existing history, but neither may send new dating messages. The
        pair stays excluded from discovery and cannot match again.
      x-required-principal: user
      security:
        - bearerAuth: []
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "204":
          description: Match closed; repeated closure is idempotent
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      x-release: chat
      x-implementation-status: placeholder
      summary: List conversations available to the current user
      description: Includes dating conversations and, if present, support conversations.
      x-required-principal: user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "200":
          description: A page of conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    get:
      tags: [Conversations]
      operationId: listMessages
      x-release: chat
      x-implementation-status: placeholder
      summary: Get conversation history
      x-required-principal: user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/MessageLimit"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "200":
          description: A page of messages ordered from newest to oldest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      operationId: sendMessage
      x-release: chat
      x-implementation-status: placeholder
      summary: Send a message to a conversation
      description: A dating conversation must be active and both users must remain allowed to communicate.
      x-required-principal: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/reports:
    post:
      tags: [Reports]
      operationId: createReport
      x-release: moderation
      x-implementation-status: placeholder
      summary: Report another user
      x-required-principal: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/reports:
    get:
      tags: [Admin]
      operationId: listReports
      x-release: moderation
      x-implementation-status: placeholder
      summary: List moderation reports
      x-required-principal: admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportStatusFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "200":
          description: A page of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/reports/{report_id}:
    parameters:
      - $ref: "#/components/parameters/ReportID"
    patch:
      tags: [Admin]
      operationId: processReport
      x-release: moderation
      x-implementation-status: placeholder
      summary: Process or reject a moderation report
      x-required-principal: admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessReportRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "200":
          description: Report updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Admin]
      operationId: inspectUser
      x-release: moderation
      x-implementation-status: placeholder
      summary: Inspect a user for moderation
      x-required-principal: admin
      security:
        - bearerAuth: []
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "200":
          description: User moderation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/{user_id}/block:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [Admin]
      operationId: blockUser
      x-release: moderation
      x-implementation-status: placeholder
      summary: Block a user
      x-required-principal: admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "200":
          description: User blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/{user_id}/messages:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [Admin]
      operationId: sendAdminMessage
      x-release: moderation
      x-implementation-status: placeholder
      summary: Send a support message to a user
      description: Creates or reuses a support conversation; it never writes to a dating conversation.
      x-required-principal: admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMessageRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "201":
          description: Support message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/users/{user_id}/notifications:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [Admin]
      operationId: notifyUser
      x-release: moderation
      x-implementation-status: placeholder
      summary: Queue a one-way system notification
      description: The notification is not a chat message and does not create a conversation.
      x-required-principal: admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "202":
          description: Notification accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access JWT issued by the authentication endpoints. The custom
        `principal` claim is either `user` or `admin`; operations additionally
        declare the required principal through `x-required-principal`.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MessageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoID:
      name: photo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationID:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchID:
      name: match_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportID:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ReportStatus"

  responses:
    BadRequest:
      description: Malformed JSON, cursor, or request parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required or the token is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: Login or password is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_credentials
              message: Invalid login or password
    Forbidden:
      description: The principal is not allowed to perform the operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Request fields or business values are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Uploaded payload exceeds the configured limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Media type is not supported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotImplemented:
      description: Route exists as a placeholder; the use case is not implemented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
        request_id:
          type: string
          description: Identifier used to correlate the error with server logs.

    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          examples: [validation_failed]
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, age]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Must contain no more than 72 UTF-8 bytes because bcrypt is used.
        age:
          type: integer
          minimum: 18
          maximum: 120
          description: Required declared age. Invalid age prevents registration before any user is created.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72

    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1

    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/Session"

    Session:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - token_type
        - access_expires_at
        - refresh_expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time

    User:
      type: object
      additionalProperties: false
      required: [id, email, age, is_blocked, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        age:
          type: integer
          minimum: 18
          maximum: 120
        is_blocked:
          type: boolean
        created_at:
          type: string
          format: date-time

    Sex:
      type: string
      enum: [male, female]

    SearchSex:
      type: string
      enum: [male, female, any]

    PutProfileRequest:
      type: object
      additionalProperties: false
      required: [name, age, sex, city]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        bio:
          type: string
          maxLength: 500
          default: ""
        age:
          type: integer
          minimum: 18
          maximum: 120
          description: Updates the single stored age in users.age; date of birth is not collected.
        sex:
          $ref: "#/components/schemas/Sex"
        city:
          type: string
          minLength: 1
          maxLength: 100

    Profile:
      type: object
      additionalProperties: false
      required: [user_id, name, bio, age, sex, city, is_sleeping]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        bio:
          type: string
        age:
          type: integer
          minimum: 18
          maximum: 120
        sex:
          $ref: "#/components/schemas/Sex"
        city:
          type: string
        is_sleeping:
          type: boolean

    PutPreferencesRequest:
      type: object
      additionalProperties: false
      required: [min_age, max_age, sex]
      properties:
        min_age:
          type: integer
          minimum: 18
          maximum: 120
        max_age:
          type: integer
          minimum: 18
          maximum: 120
        sex:
          $ref: "#/components/schemas/SearchSex"

    Preferences:
      type: object
      additionalProperties: false
      required: [user_id, min_age, max_age, sex]
      properties:
        user_id:
          type: string
          format: uuid
        min_age:
          type: integer
          minimum: 18
          maximum: 120
        max_age:
          type: integer
          minimum: 18
          maximum: 120
        sex:
          $ref: "#/components/schemas/SearchSex"

    ProfileView:
      type: object
      additionalProperties: false
      required: [profile, preferences, photos]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        preferences:
          description: Null until the user sets preferences; no defaults are invented.
          anyOf:
            - $ref: "#/components/schemas/Preferences"
            - type: "null"
        photos:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/Photo"

    SetSleepRequest:
      type: object
      additionalProperties: false
      required: [is_sleeping]
      properties:
        is_sleeping:
          type: boolean

    SleepState:
      type: object
      additionalProperties: false
      required: [is_sleeping]
      properties:
        is_sleeping:
          type: boolean

    UploadPhotoRequest:
      type: object
      additionalProperties: false
      required: [file, position]
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG, or WebP image, at most 10 MiB (10485760 bytes) and 25000000 decoded pixels.
        position:
          type: integer
          minimum: 1
          maximum: 5

    Photo:
      type: object
      additionalProperties: false
      required: [id, url, position]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Public or presigned URL. The underlying object key is never exposed.
        position:
          type: integer
          minimum: 1
          maximum: 5

    PublicUserSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        age:
          type: integer
          minimum: 18
        photo_url:
          type: string
          format: uri

    FeedCandidate:
      type: object
      additionalProperties: false
      required: [user_id, name, bio, age, sex, city, photos]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        bio:
          type: string
        age:
          type: integer
          minimum: 18
        sex:
          $ref: "#/components/schemas/Sex"
        city:
          type: string
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"

    FeedPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedCandidate"
        next_cursor:
          type: string
          description: Omitted when there are no more candidates.

    SwipeRequest:
      type: object
      additionalProperties: false
      required: [to_user_id, is_like]
      properties:
        to_user_id:
          type: string
          format: uuid
        is_like:
          type: boolean

    SwipeResponse:
      type: object
      additionalProperties: false
      required: [matched]
      properties:
        matched:
          type: boolean
        match_id:
          type: string
          format: uuid
          description: Present only when matched is true.
        conversation_id:
          type: string
          format: uuid
          description: Present only when a new mutual match creates a conversation.

    MatchStatus:
      type: string
      enum: [active, closed]

    MatchSummary:
      type: object
      additionalProperties: false
      required: [id, status, created_at, user]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
          description: Post-MVP; present once a separate dating conversation has been created.
        status:
          $ref: "#/components/schemas/MatchStatus"
        created_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/PublicUserSummary"
        last_message:
          $ref: "#/components/schemas/MessagePreview"
        unread_count:
          type: integer
          minimum: 0

    MatchPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MatchSummary"
        next_cursor:
          type: string

    ConversationKind:
      type: string
      enum: [dating, support]

    ConversationStatus:
      type: string
      enum: [active, closed]

    ConversationSummary:
      type: object
      additionalProperties: false
      required: [id, kind, status, title, created_at, unread_count]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ConversationKind"
        status:
          $ref: "#/components/schemas/ConversationStatus"
        match_id:
          type: string
          format: uuid
          description: Present only for dating conversations.
        title:
          type: string
        peer:
          $ref: "#/components/schemas/PublicUserSummary"
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        last_message:
          $ref: "#/components/schemas/MessagePreview"
        unread_count:
          type: integer
          minimum: 0

    ConversationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        next_cursor:
          type: string

    SenderType:
      type: string
      enum: [user, admin, system]

    MessagePreview:
      type: object
      additionalProperties: false
      required: [text, sender_type, created_at]
      properties:
        text:
          type: string
        sender_type:
          $ref: "#/components/schemas/SenderType"
        created_at:
          type: string
          format: date-time

    Message:
      type: object
      additionalProperties: false
      required: [id, conversation_id, sender_type, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_type:
          $ref: "#/components/schemas/SenderType"
        sender_id:
          type: string
          format: uuid
          description: Omitted for system-generated messages.
        text:
          type: string
        reply_to_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    MessagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: string

    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        reply_to_id:
          type: string
          format: uuid

    ReportReason:
      type: string
      enum:
        - spam
        - harassment
        - inappropriate_content
        - fake_profile
        - underage
        - other

    ReportStatus:
      type: string
      enum: [pending, processed, rejected]

    ReportResolution:
      type: string
      enum: [no_action, user_warned, user_blocked, content_removed]

    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [to_user_id, reason]
      properties:
        to_user_id:
          type: string
          format: uuid
        reason:
          $ref: "#/components/schemas/ReportReason"
        comment:
          type: string
          maxLength: 1000

    Report:
      type: object
      additionalProperties: false
      required: [id, from_user_id, to_user_id, reason, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        from_user_id:
          type: string
          format: uuid
        to_user_id:
          type: string
          format: uuid
        reason:
          $ref: "#/components/schemas/ReportReason"
        comment:
          type: string
        status:
          $ref: "#/components/schemas/ReportStatus"
        resolution:
          $ref: "#/components/schemas/ReportResolution"
        moderator_comment:
          type: string
        processed_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time

    ReportPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        next_cursor:
          type: string

    ProcessReportRequest:
      type: object
      additionalProperties: false
      required: [status, resolution]
      properties:
        status:
          type: string
          enum: [processed, rejected]
        resolution:
          $ref: "#/components/schemas/ReportResolution"
        comment:
          type: string
          maxLength: 1000

    AdminUserView:
      type: object
      additionalProperties: false
      required: [user, photos, report_count]
      properties:
        user:
          $ref: "#/components/schemas/User"
        profile:
          $ref: "#/components/schemas/Profile"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        report_count:
          type: integer
          minimum: 0

    BlockUserRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000

    BlockState:
      type: object
      additionalProperties: false
      required: [user_id, is_blocked]
      properties:
        user_id:
          type: string
          format: uuid
        is_blocked:
          type: boolean
          const: true

    AdminMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000

    AdminMessageResponse:
      type: object
      additionalProperties: false
      required: [conversation_id, message]
      properties:
        conversation_id:
          type: string
          format: uuid
        message:
          $ref: "#/components/schemas/Message"

    NotificationRequest:
      type: object
      additionalProperties: false
      required: [title, message]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 1000

    NotificationAccepted:
      type: object
      additionalProperties: false
      required: [notification_id, status]
      properties:
        notification_id:
          type: string
          format: uuid
        status:
          type: string
          const: accepted
